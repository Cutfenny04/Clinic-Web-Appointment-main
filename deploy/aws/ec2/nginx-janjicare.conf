# /etc/nginx/conf.d/janjicare.conf — EC2 "app"
# Satu pintu untuk CloudFront: /api → backend Express, /auth/v1 → Supabase Auth (GoTrue), /rest/v1 → PostgREST
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 3m;          # foto dokter maks 2 MB

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/      { proxy_pass http://127.0.0.1:3000; }
    location /auth/v1/  { proxy_pass http://127.0.0.1:9999/; }
    location /rest/v1/  { proxy_pass http://127.0.0.1:3001/; }

    location / { return 404; }
}
