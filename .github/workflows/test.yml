name: JanjiCare CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend API (npm test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: janjicare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    env:
      NODE_ENV: test
      # Database kosong khusus tes: skema dibangun ulang dari backend/sql setiap kali tes berjalan
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/janjicare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  queue-service:
    name: Queue Service (npm test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ./services/queue-service
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/queue-service/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (npm run build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./janjicare-frontend
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: janjicare-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
